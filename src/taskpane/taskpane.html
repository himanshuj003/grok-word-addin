<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Grok for Word</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js" type="text/javascript"></script>
  <link rel="stylesheet" href="taskpane.css" />
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <span class="logo-icon">⚡</span>
        <span class="logo-text">Grok</span>
      </div>
      <button id="settings-btn" class="icon-btn" title="Settings">⚙️</button>
    </header>

    <!-- Settings Panel (hidden by default) -->
    <div id="settings-panel" class="settings-panel hidden">
      <label for="api-key">xAI API Key</label>
      <input type="password" id="api-key" placeholder="xai-..." />
      <div class="settings-actions">
        <button id="save-key" class="btn primary">Save Key</button>
        <button id="clear-key" class="btn secondary">Clear</button>
      </div>
      <p class="hint">Key is stored only in this browser. Never share it.</p>
      <hr />
      <label class="checkbox-label">
        <input type="checkbox" id="auto-context" checked />
        Auto-send selection as context
      </label>
    </div>

    <!-- Quick Actions -->
    <div class="quick-actions">
      <button id="btn-selection" class="action-btn" title="Use current selection">Selection</button>
      <button id="btn-full-doc" class="action-btn" title="Use full document">Full Doc</button>
      <button id="btn-rewrite" class="action-btn" title="Rewrite selection">Rewrite</button>
      <button id="btn-insert" class="action-btn primary" title="Insert last reply">Insert</button>
    </div>

    <!-- Chat Area -->
    <div id="chat-container" class="chat-container">
      <div id="messages" class="messages">
        <div class="message system">
          Welcome! Enter your xAI API key in settings, then start chatting with Grok.
        </div>
      </div>
    </div>

    <!-- Input Area -->
    <div class="input-area">
      <textarea id="user-input" placeholder="Ask Grok anything about your document..." rows="2"></textarea>
      <button id="send-btn" class="send-btn" title="Send">➤</button>
    </div>
  </div>

  <script src="taskpane.js"></script>
</body>
</html>
